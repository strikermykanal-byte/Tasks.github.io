<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="app.css">
    <link rel="shortcut icon" href="images/icon.png" type="image/x-icon">
    <title>Tasks</title>
</head>
<body>

    <!-- Navigation -->
    <section class="navapp">
        <div class="bar">

            <a href="today.html" class="card">
                <i class="fa-solid fa-calendar-days"></i>
                Today
            </a>

            <a href="plans.html" class="card">
                <i class="fa-solid fa-calendar-check"></i>
                Planned
            </a>

            <a href="incomplete.html" class="card">
                <i class="fa-solid fa-chart-bar"></i>
                Incomplete
            </a>

            <a href="all.html" class="card">
                <i class="fa-solid fa-list"></i>
                All tasks
            </a>

            <a href="completed.html" class="card">
                <i class="fa-solid fa-calendar-check"></i>
                Completed
            </a>

        </div>
    </section>

    <!-- Task input -->
    <div class="inp">

        <label for="inp">New tasks</label>

        <div class="input-wrapper">

            <input
                type="text"
                name="tasks"
                id="inp"
                placeholder="Enter your task"
            >
            <input type="date" id="task-date">
            <button class="addBtn" id="addBtn">
                <i class="fa-solid fa-plus"></i>
            </button>

        </div>
    </div>
         <ul id="task-list"></ul>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h1>Are you sure you want to delete this?</h1>
            <div class="modal-btns">
                <button id="canc">Cancel</button>
                <button id="conf">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Окно редактирования -->
    <div class="modal-overlay" id="edit-overlay">
        <div class="modal">
            <h1>Edit your task</h1>
            <input type="text" id="edit-input" class="modal-input" placeholder="Enter new task">
            <div class="modal-btns">
                <button id="edit-canc">Cancel</button>
                <button id="edit-save">Save</button>
            </div>
            
        </div>
    </div>

    <script src="app.js"></script>

    <script src="app.js"></script>

</body>
</html>
